<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notícias Jurídicas — CSA</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root,#csa-noticias{
  --bg:#0d0f14;--surface:#15181f;--card:#1c2029;
  --border:rgba(255,255,255,0.07);--border-hi:rgba(255,255,255,0.14);
  --accent:#e8a84c;--accent-dim:rgba(232,168,76,0.10);--accent-mid:rgba(232,168,76,0.18);
  --accent2:#5b8cff;--text:#f0ede8;--muted:#8a8d96;--muted2:#545760;
  --radius:12px;--radius-sm:7px;
  --ff-title:'Sora',sans-serif;--ff-body:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
#csa-noticias{background:var(--bg);color:var(--text);font-family:var(--ff-body);min-height:100vh;}

/* Nav */
.csa-nav{
  position:sticky;top:0;z-index:100;
  background:rgba(13,15,20,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:0 40px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-logo{font-family:var(--ff-title);font-weight:800;font-size:1.1rem;color:var(--text);text-decoration:none;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;}
.nav-logo span{color:var(--accent);}
.nav-badge{font-size:.65rem;font-weight:700;font-family:var(--ff-title);background:var(--accent-dim);color:var(--accent);border:1px solid rgba(232,168,76,.25);padding:3px 9px;border-radius:100px;letter-spacing:.04em;text-transform:uppercase;}
.nav-cta{font-family:var(--ff-title);font-weight:700;font-size:.8rem;background:var(--accent);color:#1a1000;padding:9px 22px;border-radius:var(--radius-sm);text-decoration:none;letter-spacing:-.01em;transition:opacity .15s;}
.nav-cta:hover{opacity:.88;}

/* Header */
.page-header{background:var(--surface);border-bottom:1px solid var(--border);padding:56px 40px 48px;text-align:center;}
.page-header h1{font-family:var(--ff-title)!important;color:var(--text)!important;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800!important;letter-spacing:-.03em;line-height:1.15;margin-bottom:14px;}
.page-header h1 span{color:var(--accent);}
.page-header p{font-size:1rem;color:var(--muted);max-width:520px;margin:0 auto;line-height:1.6;}
.update-badge{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-size:.75rem;color:var(--muted2);font-family:var(--ff-title);}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* Tabs */
.tabs-wrap{max-width:1200px;margin:0 auto;padding:32px 40px 0;}
.tabs-row{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
.tab-btn{
  font-family:var(--ff-title);font-weight:600;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;
  padding:11px 20px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;
  border:1px solid transparent;border-bottom:none;
  background:transparent;color:var(--muted);cursor:pointer;transition:all .18s;
  position:relative;bottom:-1px;display:flex;align-items:center;gap:7px;
}
.tab-btn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4;transition:opacity .18s;}
.tab-btn:hover{color:var(--text);background:var(--surface);}
.tab-btn.active{color:var(--accent);background:var(--bg);border-color:var(--border);border-bottom-color:var(--bg);}
.tab-btn.active .dot{opacity:1;}

/* Grid */
.content-wrap{max-width:1200px;margin:0 auto;padding:32px 40px 72px;}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;}

/* Card */
.news-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;
  transition:border-color .2s,transform .2s;
}
.news-card:hover{border-color:var(--border-hi);transform:translateY(-2px);}
.news-card.featured{grid-column:span 2;flex-direction:row;}
@media(max-width:700px){.news-card.featured{grid-column:span 1;flex-direction:column;}}

.card-thumb{
  width:100%;aspect-ratio:16/9;object-fit:cover;
  background:var(--surface);flex-shrink:0;display:block;
}
.news-card.featured .card-thumb{width:38%;aspect-ratio:auto;height:100%;min-height:220px;}
@media(max-width:700px){.news-card.featured .card-thumb{width:100%;height:180px;}}

.card-body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1;}
.card-cat{font-family:var(--ff-title);font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:5px;}
.card-cat-dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;}
.card-title{font-family:var(--ff-title)!important;color:var(--text)!important;font-size:.92rem;font-weight:700!important;line-height:1.45;margin-bottom:10px;}
.news-card.featured .card-title{font-size:1.1rem;}
.card-excerpt{font-size:.82rem;color:var(--muted);line-height:1.6;flex:1;margin-bottom:14px;}
.card-date{font-size:.7rem;color:var(--muted2);font-family:var(--ff-title);margin-top:auto;}

/* Cores por carreira */
.cat-procuradoria{color:#e8a84c;}
.cat-magistratura{color:#a78bfa;}
.cat-promotoria{color:#60a5fa;}
.cat-defensoria{color:#34d399;}
.cat-delegado{color:#f87171;}

/* Estados */
.state-box{grid-column:1/-1;padding:80px 0;text-align:center;color:var(--muted);font-family:var(--ff-title);}
.state-box p{font-size:.88rem;margin-top:12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--border-hi);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto;}

/* Footer */
.csa-footer{background:var(--surface);border-top:1px solid var(--border);padding:28px 40px;text-align:center;}
.footer-text{font-size:.75rem;color:var(--muted2);font-family:var(--ff-title);}
.footer-text a{color:var(--muted);text-decoration:none;}
.footer-text a:hover{color:var(--accent);}

/* Mobile */
@media(max-width:768px){
  .csa-nav{padding:0 20px;}
  .page-header{padding:36px 20px 28px;}
  .tabs-wrap{padding:24px 20px 0;}
  .tab-btn{padding:9px 13px;font-size:.68rem;}
  .content-wrap{padding:24px 20px 48px;}
  .news-grid{grid-template-columns:1fr;gap:14px;}
}
</style>
</head>
<body>
<div id="csa-noticias">

<nav class="csa-nav">
  <a href="https://csaconcurso.com.br" class="nav-logo">
    CSA <span>concursos</span>
    <span class="nav-badge">Notícias</span>
  </a>
  <a href="https://csaconcurso.com.br/csapremium/" class="nav-cta" target="_blank" rel="noopener">
    Conhecer o CSA Premium →
  </a>
</nav>

<header class="page-header">
  <h1>Notícias das <span>Carreiras Jurídicas</span></h1>
  <p>Editais, concursos e novidades de Procuradoria, Magistratura, Ministério Público, Defensoria e Delegado — tudo em um lugar.</p>
  <div class="update-badge">
    <span class="pulse"></span>
    Atualizado a cada hora
  </div>
</header>

<div class="tabs-wrap">
  <div class="tabs-row" role="tablist">
    <button class="tab-btn active" data-cat="procuradoria" onclick="switchCat(this)" role="tab"><span class="dot"></span>Procuradoria</button>
    <button class="tab-btn" data-cat="magistratura"  onclick="switchCat(this)" role="tab"><span class="dot"></span>Magistratura</button>
    <button class="tab-btn" data-cat="promotoria"    onclick="switchCat(this)" role="tab"><span class="dot"></span>Ministério Público</button>
    <button class="tab-btn" data-cat="defensoria"    onclick="switchCat(this)" role="tab"><span class="dot"></span>Defensoria</button>
    <button class="tab-btn" data-cat="delegado"      onclick="switchCat(this)" role="tab"><span class="dot"></span>Delegado</button>
  </div>
</div>

<main class="content-wrap">
  <div class="news-grid" id="grid"></div>
</main>

<footer class="csa-footer">
  <p class="footer-text">
    © 2026 <a href="https://csaconcurso.com.br">CSA — Construindo Sua Aprovação</a> ·
    <a href="https://csaconcurso.com.br/csapremium/">CSA Premium</a> ·
    <a href="http://wa.me/5541987976084">Mentoria</a>
  </p>
</footer>

</div>
<script>
const CATS = {
  procuradoria: { label:'Procuradoria',     cls:'cat-procuradoria' },
  magistratura: { label:'Magistratura',     cls:'cat-magistratura' },
  promotoria:   { label:'Ministério Público', cls:'cat-promotoria' },
  defensoria:   { label:'Defensoria',       cls:'cat-defensoria'  },
  delegado:     { label:'Delegado',         cls:'cat-delegado'    },
};

let active = 'procuradoria';
const cache = {};

function switchCat(btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  active = btn.dataset.cat;
  loadNews(active);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderLoading() {
  document.getElementById('grid').innerHTML = '<div class="state-box"><div class="spinner"></div><p>Carregando notícias...</p></div>';
}

function renderError() {
  document.getElementById('grid').innerHTML = '<div class="state-box"><p>Não foi possível carregar agora. Tente novamente em instantes.</p></div>';
}

function renderArticles(articles, cat) {
  const c = CATS[cat];
  if (!articles || !articles.length) { renderError(); return; }

  document.getElementById('grid').innerHTML = articles.map((a, i) => {
    const featured = i === 0;
    const thumb = a.thumb
      ? `<img class="card-thumb" src="${esc(a.thumb)}" alt="${esc(a.title)}" onerror="this.style.display='none'">`
      : '';

    return `
      <div class="news-card${featured ? ' featured' : ''}">
        ${thumb}
        <div class="card-body">
          <div class="card-cat ${c.cls}"><span class="card-cat-dot"></span>${c.label}</div>
          <h2 class="card-title">${esc(a.title)}</h2>
          ${a.excerpt ? `<p class="card-excerpt">${esc(a.excerpt)}</p>` : ''}
          ${a.date ? `<p class="card-date">${esc(a.date)}</p>` : ''}
        </div>
      </div>`;
  }).join('');
}

async function loadNews(cat) {
  if (cache[cat]) { renderArticles(cache[cat], cat); return; }
  renderLoading();
  try {
    const res = await fetch(`/api/${cat}`, { signal: AbortSignal.timeout(12000) });
    if (!res.ok) throw new Error();
    const data = await res.json();
    cache[cat] = data.articles;
    renderArticles(data.articles, cat);
  } catch {
    renderError();
  }
}

loadNews('procuradoria');
</script>
</body>
</html>
